<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Kolaars Music">
  <defs>
    <radialGradient id="v3-bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#1a1930"/>
      <stop offset="0.55" stop-color="#0d0d16"/>
      <stop offset="1" stop-color="#08080d"/>
    </radialGradient>
    <radialGradient id="v3-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#5a7cff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#35d0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v3-disc" x1="180" y1="160" x2="856" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cff"/>
      <stop offset="0.5" stop-color="#4a7cff"/>
      <stop offset="1" stop-color="#2ec8ff"/>
    </linearGradient>
    <radialGradient id="v3-gloss" cx="0.3" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v3-ring" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9d7dff"/>
      <stop offset="0.5" stop-color="#5a7cff"/>
      <stop offset="1" stop-color="#35d0ff"/>
    </linearGradient>
    <filter id="v3-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#120b3a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#v3-bg)"/>
  <circle cx="512" cy="512" r="512" fill="url(#v3-glow)"/>

  <circle cx="512" cy="512" r="384" fill="url(#v3-disc)" filter="url(#v3-shadow)"/>
  <circle cx="512" cy="512" r="384" fill="url(#v3-gloss)"/>
  <circle cx="512" cy="512" r="384" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="4"/>
  <circle cx="512" cy="512" r="414" fill="none" stroke="url(#v3-ring)" stroke-opacity="0.4" stroke-width="5"/>

  <!-- K monogram -->
  <g fill="#ffffff" stroke="#ffffff" stroke-linecap="round">
    <rect x="308" y="300" width="96" height="424" rx="48" stroke="none"/>
    <path d="M 420 514 L 648 310" fill="none" stroke-width="96"/>
    <path d="M 420 506 L 656 716" fill="none" stroke-width="96"/>
  </g>
</svg>
