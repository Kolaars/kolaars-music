<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Kolaars Music">
  <defs>
    <radialGradient id="v1-bg" cx="50%" cy="38%" r="80%">
      <stop offset="0" stop-color="#1e1d34"/>
      <stop offset="0.55" stop-color="#0e0e18"/>
      <stop offset="1" stop-color="#08080d"/>
    </radialGradient>
    <radialGradient id="v1-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="0.58" stop-color="#5a7cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#35d0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v1-rim" x1="164" y1="140" x2="872" y2="884" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9d7dff"/>
      <stop offset="0.5" stop-color="#5a7cff"/>
      <stop offset="1" stop-color="#35d0ff"/>
    </linearGradient>
    <linearGradient id="v1-label" x1="350" y1="350" x2="674" y2="674" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b6cff"/>
      <stop offset="0.55" stop-color="#5a7cff"/>
      <stop offset="1" stop-color="#35d0ff"/>
    </linearGradient>
    <radialGradient id="v1-gloss" cx="0.32" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v1-label-gloss" cx="0.32" cy="0.2" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#v1-bg)"/>
  <circle cx="512" cy="512" r="512" fill="url(#v1-glow)"/>

  <!-- vinyl disc -->
  <circle cx="512" cy="512" r="392" fill="#0f0f18"/>
  <circle cx="512" cy="512" r="392" fill="url(#v1-gloss)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2.5">
    <circle cx="512" cy="512" r="344"/>
    <circle cx="512" cy="512" r="320"/>
    <circle cx="512" cy="512" r="296"/>
    <circle cx="512" cy="512" r="272"/>
    <circle cx="512" cy="512" r="248"/>
    <circle cx="512" cy="512" r="224"/>
  </g>
  <circle cx="512" cy="512" r="392" fill="none" stroke="url(#v1-rim)" stroke-width="12"/>
  <circle cx="512" cy="512" r="378" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="10"/>

  <!-- label -->
  <circle cx="512" cy="512" r="168" fill="url(#v1-label)"/>
  <circle cx="512" cy="512" r="168" fill="url(#v1-label-gloss)"/>
  <circle cx="512" cy="512" r="172" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- equalizer -->
  <g fill="#ffffff">
    <rect x="389" y="473" width="30" height="78" rx="15"/>
    <rect x="443" y="442" width="30" height="140" rx="15"/>
    <rect x="497" y="414" width="30" height="196" rx="15"/>
    <rect x="551" y="442" width="30" height="140" rx="15"/>
  </g>
</svg>
