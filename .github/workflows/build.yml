name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type-check and build the three Electron processes. Runs on both platforms so
  # the shared layer and the renderer cannot silently become Windows-only.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit checks (track lists, sidecar covers, file names)
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build output
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out
          retention-days: 7

  # End-to-end smoke test: launches the real Electron app and drives the UI over
  # the Chrome DevTools Protocol. Needs a desktop session, so Windows only.
  smoke:
    name: smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test
        run: node scripts/smoke.mjs --screenshot=docs/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
          if-no-files-found: ignore
          retention-days: 7

  # Full Windows build, produced for version tags.
  dist:
    name: dist (windows)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run dist:win

      - name: Smoke-test the packaged app
        run: npm run smoke:packaged

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kolaars-music-windows
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: error
          retention-days: 30
